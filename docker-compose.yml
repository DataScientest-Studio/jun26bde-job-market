services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: job_market
      POSTGRES_USER: job_market
      POSTGRES_PASSWORD: job_market
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_market -d job_market"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-market
    depends_on: # Start only after PostgreSQL is ready to accept connections
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://job_market:job_market@postgres:5432/job_market
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8050:8050"
    volumes:
      - job-market-data:/app/data

volumes:
  postgres_data:
  job-market-data: