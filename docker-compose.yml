services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: job_market
      POSTGRES_USER: job_market
      POSTGRES_PASSWORD: job_market
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_market -d job_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://job_market:job_market@postgres:5432/job_market
    ports:
      - "127.0.0.1:8000:8000"
    command:
      [
        "python", "-m", "uvicorn",
        "src.api.main:api",
        "--host", "0.0.0.0",
        "--port", "8000"
      ]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      FASTAPI_URL: http://backend:8000
      FRONTEND_PORT: 8050
    ports:
      - "127.0.0.1:8050:8050"
    command:
      ["python", "-m", "src.dashboard.app"]

  data-update:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://job_market:job_market@postgres:5432/job_market
    volumes:
      - job-market-data:/app/data
    command:
      ["python", "-m", "src.data.etl.etl"]

volumes:
  postgres_data:
  job-market-data: