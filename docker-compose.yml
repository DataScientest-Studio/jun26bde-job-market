services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: job_market
      POSTGRES_USER: job_market
      POSTGRES_PASSWORD: job_market
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_market -d job_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://job_market:job_market@postgres:5432/job_market
    ports:
      - "127.0.0.1:8000:8000"
    command:
      [
        "python", "-m", "uvicorn",
        "src.api.main:api",
        "--host", "0.0.0.0",
        "--port", "8000"
      ]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      FASTAPI_URL: http://backend:8000
      FRONTEND_PORT: 8050
    ports:
      - "127.0.0.1:8050:8050"
    command:
      ["python", "-m", "src.dashboard.app"]

  data-update:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pushgateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://job_market:job_market@postgres:5432/job_market
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - job-market-data:/app/data
    command:
      ["python", "-m", "src.data.etl.etl"]

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pushgateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://job_market:job_market@postgres:5432/job_market
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - job-market-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    command: airflow standalone

  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9090:9090" # Expose Prometheus on localhost only
    volumes:
      # Prometheus configuration
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Persist Prometheus data
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

volumes:
  postgres_data:
  job-market-data:
  prometheus_data:
